name: Probe NGA history (試験・手動のみ)

# 過去の航行警報を NGA の窓口から引けるかを確かめるだけの試験。
# 何も書き込まない・コミットしない（結果はログに出すだけ）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe smaps (ROCKET LAUNCHING)
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) Get_NAVWARN probe"
          A="https://msi.nga.mil/api/publications/smaps"
          probe () {
            code=$(curl -s -A "$UA" --max-time 300 -o /tmp/r.out -w "%{http_code}" "$1")
            echo "=== HTTP $code  $(wc -c < /tmp/r.out)B  $1"
            python3 - <<'EOF'
          import json, collections
          try:
              d = json.load(open('/tmp/r.out'))
          except Exception as e:
              print('JSON でない:', open('/tmp/r.out', errors='replace').read(300)); raise SystemExit
          rows = next((v for v in d.values() if isinstance(v, list)), [])
          print('件数', len(rows))
          if not rows: raise SystemExit
          print('項目', sorted(rows[0].keys()))
          yr = collections.Counter((r.get('createdOn') or '')[-4:] for r in rows)
          print('作成年', sorted(yr.items()))
          print('分類', collections.Counter(r.get('category') for r in rows).most_common(5))
          print('海域', collections.Counter(r.get('navArea') for r in rows).most_common(10))
          old = sorted(rows, key=lambda r: r.get('sentOnDB') or '')[:3]
          for r in old:
              print('古い:', r.get('createdOn'), r.get('navArea'), r.get('msgSqncNumber'), r.get('msgYear'), (r.get('msgText') or r.get('text') or '')[:120].replace('\n', ' '))
          EOF
          }
          probe "$A?category=14&output=json"
          probe "$A?navArea=P&category=14&output=json"
          probe "$A?navArea=4&category=14&createdOn=24&output=json"
          probe "$A?category=14&createdOn=22&output=json"
