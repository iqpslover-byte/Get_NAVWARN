name: Probe NGA history (試験・手動のみ)

# 過去の航行警報を NGA の窓口から引けるかを確かめるだけの試験。
# リポジトリには何も書き込まない（結果はログと成果物 artifact に出すだけ）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch all (active + cancelled) per area
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) Get_NAVWARN probe"
          A="https://msi.nga.mil/api/publications/broadcast-warn"
          mkdir -p /tmp/raw
          for AR in P 4 12 A C; do
            code=$(curl -s -A "$UA" --max-time 600 -o /tmp/raw/$AR.json -w "%{http_code}" "$A?navArea=$AR&status=all&output=json")
            echo "=== $AR HTTP $code $(wc -c < /tmp/raw/$AR.json)B"
            sleep 2
          done
      - name: Filter launch-related
        run: |
          mkdir -p /tmp/out
          python3 - <<'EOF'
          import json, re, collections, glob, os
          LAUNCH = re.compile(r'ROCKET\s+LAUNCH|SPACE\s+LAUNCH|SPACE\s+VEHICLE|LAUNCH(?:ING)?\s+OPERATION|MISSILE\s+LAUNCH', re.I)
          DEBRIS = re.compile(r'SPACE\s+DEBRIS|ROCKET\s+DEBRIS|DEBRIS\s+SPLASH|SPLASHDOWN|RE-?ENTRY', re.I)
          out = []
          for p in sorted(glob.glob('/tmp/raw/*.json')):
              ar = os.path.basename(p)[:-5]
              try:
                  rows = json.load(open(p)).get('broadcast-warn') or []
              except Exception as e:
                  print(ar, 'JSON でない', e); continue
              seen = set(); kinds = collections.Counter(); yrs = collections.Counter()
              for r in rows:
                  k = (r.get('msgYear'), r.get('msgNumber'))
                  if k in seen: continue
                  seen.add(k)
                  t = r.get('text') or ''
                  kind = 'launch' if LAUNCH.search(t) else ('debris' if DEBRIS.search(t) else None)
                  if not kind: continue
                  kinds[kind] += 1; yrs[r.get('msgYear')] += 1
                  out.append({'navArea': ar, 'msgYear': r.get('msgYear'), 'msgNumber': r.get('msgNumber'),
                              'authority': r.get('authority'), 'issueDate': r.get('issueDate'),
                              'cancelDate': r.get('cancelDate'), 'status': r.get('status'),
                              'kind': kind, 'text': t})
              print('==', ar, '全件', len(seen), '打上げ関係', dict(kinds))
              print('   年ごと', sorted((y, n) for y, n in yrs.items() if y))
          json.dump(out, open('/tmp/out/launch_warnings.json', 'w'), ensure_ascii=False)
          print('合計', len(out), '件', os.path.getsize('/tmp/out/launch_warnings.json'), 'B')
          if out:
              print('項目', sorted(json.load(open(glob.glob('/tmp/raw/P.json')[0]))['broadcast-warn'][0].keys()))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: launch_warnings
          path: /tmp/out/launch_warnings.json
          retention-days: 7
