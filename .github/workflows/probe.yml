name: Probe MaritimeNZ proxies (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try proxies
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0"
          T="https://www.maritimenz.govt.nz/navigational-warnings/"
          E="https%3A%2F%2Fwww.maritimenz.govt.nz%2Fnavigational-warnings%2F"
          probe() {
            NAME="$1"; URL="$2"
            CODE=$(curl -s --max-time 30 -A "$UA" -H "X-Requested-With: XMLHttpRequest" -o /tmp/p.out -w "%{http_code}" "$URL" || echo "ERR")
            SIZE=$(wc -c < /tmp/p.out 2>/dev/null || echo 0)
            HITS=$(grep -coiE "[0-9]{2}-[0-9]{2}\.?[0-9]*[NS]" /tmp/p.out || true)
            printf '%-14s code=%-5s size=%-8s coords=%s\n' "$NAME" "$CODE" "$SIZE" "$HITS"
          }
          echo "--- 判定: code=200 かつ coords>0 なら採用 / coords=0 は中身が偽物 ---"
          probe "direct"     "$T"
          probe "jina"       "https://r.jina.ai/$T"
          probe "cors.eu.org" "https://cors.eu.org/$T"
          probe "proxy.cors.sh" "https://proxy.cors.sh/$T"
          probe "allorigins"  "https://api.allorigins.win/raw?url=$E"
          probe "corsproxy.io" "https://corsproxy.io/?url=$E"
          probe "codetabs"    "https://api.codetabs.com/v1/proxy?quest=$E"
