name: Fetch NAVWARN Data

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch NGA MSI files
        run: |
          mkdir -p data
          BASE="https://msi.nga.mil/api/publications/download?type=view&key=16694640/SFH00000"
          for F in DailyMemPAC.txt DailyMemXII.txt DailyMemLAN.txt DailyMemIV.txt DailyMemARC.txt; do
            curl -fsSL "$BASE/$F" -o "data/$F" || true
          done

      # NAVAREA XIV（調整国＝ニュージーランド）と NZ Coastal は NGA の DailyMem に入らないため個別に取る
      - name: Fetch NAVAREA XIV / NZ coastal
        run: |
          mkdir -p data
          UA="Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0"
          # 公式の Maritime NZ (www.maritimenz.govt.nz/navigational-warnings/) は
          # Actionsのランナー(データセンターIP)から 403 を返すため直接は取れない。
          # 家庭回線からは User-Agent さえ付ければ 200 で取れるので、遮断はIP側。
          # 同じ電文を載せている SeaLagom から2本取る。
          curl -fsSL -A "$UA" "https://www.sealagom.com/navarea/14/" -o data/NavareaXIV.html || true
          curl -fsSL -A "$UA" "https://www.sealagom.com/coastal/New%20Zealand%20Coastal/Coastal/" -o data/NZCoastal.html || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update NAVWARN data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
